# render.yaml — Render.com deployment configuration for MALAI VIZHI
# Deploys a single web service: Flask serves both the API and the React SPA.
#
# Before deploying:
#   1. Push this file to GitHub
#   2. In Render dashboard → New → Blueprint → connect your repo
#   3. Set ALLOWED_ORIGINS to your Render service URL after first deploy
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: malai-vizhi
    runtime: python
    region: singapore          # Closest to India for SIH demo
    plan: free

    # Build: install Python deps, then build the React frontend
    buildCommand: |
      pip install -r requirements.txt
      cd frontend-react && npm install && npm run build

    # Start: gunicorn WSGI server — never debug=True in production
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    envVars:
      - key: FLASK_DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        # Set this to your Render URL after first deploy, e.g.:
        # https://malai-vizhi.onrender.com
        value: ""
      - key: PORT
        generateValue: false   # Render injects PORT automatically

    # Persist uploads between deploys using a Render Disk
    # Note: Free plan does not include persistent disk.
    # For SIH demo: uploads are ephemeral (lost on redeploy).
    # To enable persistence, uncomment and upgrade plan:
    # disk:
    #   name: malai-vizhi-uploads
    #   mountPath: /opt/render/project/src/uploads
    #   sizeGB: 1
